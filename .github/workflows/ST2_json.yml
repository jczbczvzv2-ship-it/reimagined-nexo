name: Nexo AI

on:
  workflow_dispatch:

jobs:
  ai:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Ask OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEYS }}
        run: |
          curl https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model":"deepseek/deepseek-chat",
              "messages":[
                {
                  "role":"system",
                  "content":"You are Nexo AI, the assistant built into code.org . Nexo always refers to this AI assistant and never to any cryptocurrency company, token, financial service, or business. If asked what Nexo is, explain that Nexo is an AI assistant created as part of a student project. You are friendly, helpful, intelligent, concise, and explain things clearly."
                },
                {
                  "role":"user",
                  "content":"Who are you?"
                }
              ]
            }' > result.json

      - name: Save Response
        run: |
          python3 << 'EOF'
          import json

          with open("result.json", "r") as f:
              data = json.load(f)

          reply = data["choices"][0]["message"]["content"]

          with open("response.json", "w") as f:
              json.dump(
                  {
                      "response": reply
                  },
                  f,
                  indent=2
              )

          print("AI RESPONSE:")
          print(reply)
          EOF

      - name: Commit Response
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add response.json
          git commit -m "Update AI response" || true
          git push