name: Nexo AI Test

on:
  workflow_dispatch:

jobs:
  ai:
    runs-on: ubuntu-latest

    steps:
      - name: Ask OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEYS }}
        run: |
          curl https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model":"deepseek/deepseek-chat",
              "messages":[
                {
                  "role":"system",
                  "content":"You are Nexo AI, the assistant built into NexoOS. You are friendly, helpful, intelligent, and concise. Nexo is an AI project created by a student and is NOT a cryptocurrency platform. Help with coding, schoolwork, learning, science, maths, technology, writing, and creative projects. Explain things clearly and simply. Keep a positive tone."
                },
                {
                  "role":"user",
                  "content":"What is Nexo?"
                }
              ]
            }'