name: Nexo AI

on:
  workflow_dispatch:
    inputs:
      model:
        description: AI Model
        required: true
        default: Gemini
      prompt:
        description: Prompt
        required: true
        default: Hello

jobs:
  ai:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Ask Nexo AI
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEM }}
        run: |
          python3 << 'EOF'
          import requests
          import os

          model = "${{ github.event.inputs.model }}"
          prompt = "${{ github.event.inputs.prompt }}"

          SYSTEM_PROMPT = """
          You are Nexo AI, the built-in assistant of Android Phone.

          You help with:
          - Coding
          - Schoolwork
          - Research
          - Technology
          - Creativity
          - General questions

          Rules:
          - Be friendly.
          - Be helpful.
          - Explain clearly.
          - Never describe Nexo as a cryptocurrency company.
          - Nexo always refers to Nexo AI.
          """

          result = ""

          try:

              if model == "DeepSeek":

                  r = requests.post(
                      "https://openrouter.ai/api/v1/chat/completions",
                      headers={
                          "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                          "Content-Type": "application/json"
                      },
                      json={
                          "model":"deepseek/deepseek-chat",
                          "messages":[
                              {
                                  "role":"system",
                                  "content":SYSTEM_PROMPT
                              },
                              {
                                  "role":"user",
                                  "content":prompt
                              }
                          ]
                      }
                  )

                  result = r.json()["choices"][0]["message"]["content"]

              elif model == "GPT":

                  r = requests.post(
                      "https://openrouter.ai/api/v1/chat/completions",
                      headers={
                          "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                          "Content-Type": "application/json"
                      },
                      json={
                          "model":"openai/gpt-4o-mini",
                          "messages":[
                              {
                                  "role":"system",
                                  "content":SYSTEM_PROMPT
                              },
                              {
                                  "role":"user",
                                  "content":prompt
                              }
                          ]
                      }
                  )

                  result = r.json()["choices"][0]["message"]["content"]

              elif model == "Gemini":

                  r = requests.post(
                      f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key={os.environ['GEMINI_API_KEY']}",
                      headers={
                          "Content-Type":"application/json"
                      },
                      json={
                          "contents":[
                              {
                                  "parts":[
                                      {
                                          "text": SYSTEM_PROMPT + "\n\nUser: " + prompt
                                      }
                                  ]
                              }
                          ]
                      }
                  )

                  data = r.json()

                  try:
                      result = data["candidates"][0]["content"]["parts"][0]["text"]
                  except:
                      result = str(data)

              with open("response.txt", "w", encoding="utf-8") as f:
                  f.write(result)

          except Exception as e:

              with open("response.txt", "w", encoding="utf-8") as f:
                  f.write("ERROR:\n" + str(e))

          EOF

      - name: Commit Response
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add response.txt
          git commit -m "Nexo AI Response" || true
          git push