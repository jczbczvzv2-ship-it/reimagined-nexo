name: Nexo AI

on:
  workflow_dispatch:
    inputs:
      model:
        description: "AI Model"
        required: true
        default: "Gemini"

      prompt:
        description: "Prompt"
        required: true
        default: "Hello"

jobs:
  ai:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Ask Nexo AI
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEM }}
        run: |
          python3 << 'EOF'
          import requests
          import json
          import os

          model = "${{ github.event.inputs.model }}"
          prompt = "${{ github.event.inputs.prompt }}"

          SYSTEM_PROMPT = """
          You are Nexo AI, the intelligent assistant built into Android Phone.

          You help users with:
          - Coding
          - Schoolwork
          - Research
          - Technology
          - Productivity
          - Creativity
          - General questions

          Rules:
          - Be friendly and helpful.
          - Explain clearly.
          - Give accurate answers.
          - Never identify Nexo as a cryptocurrency company.
          - Nexo always refers to Nexo AI.
          """

          result = ""

          try:

              if model == "DeepSeek":

                  r = requests.post(
                      "https://openrouter.ai/api/v1/chat/completions",
                      headers={
                          "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                          "Content-Type": "application/json"
                      },
                      json={
                          "model":"deepseek/deepseek-chat",
                          "messages":[
                              {
                                  "role":"system",
                                  "content":SYSTEM_PROMPT
                              },
                              {
                                  "role":"user",
                                  "content":prompt
                              }
                          ]
                      }
                  )

                  data = r.json()
                  result = data["choices"][0]["message"]["content"]

              elif model == "GPT":

                  r = requests.post(
                      "https://openrouter.ai/api/v1/chat/completions",
                      headers={
                          "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                          "Content-Type": "application/json"
                      },
                      json={
                          "model":"openai/gpt-4o-mini",
                          "messages":[
                              {
                                  "role":"system",
                                  "content":SYSTEM_PROMPT
                              },
                              {
                                  "role":"user",
                                  "content":prompt
                              }
                          ]
                      }
                  )

                  data = r.json()
                  result = data["choices"][0]["message"]["content"]

              elif model == "Gemini":

                  r = requests.post(
                      f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key={os.environ['GEMINI_API_KEY']}",
                      headers={
                          "Content-Type":"application/json"
                      },
                      json={
                          "contents":[
                              {
                                  "parts":[
                                      {
                                          "text": SYSTEM_PROMPT + "\n\nUser: " + prompt
                                      }
                                  ]
                              }
                          ]
                      }
                  )

                  data = r.json()

                  try:
                      result = data["candidates"][0]["content"]["parts"][0]["text"]
                  except:
                      result = json.dumps(data)

              with open("response.json","w") as f:
                  json.dump(
                      {
                          "model": model,
                          "prompt": prompt,
                          "response": result
                      },
                      f,
                      indent=2
                  )

              print(result)

          except Exception as e:

              with open("response.json","w") as f:
                  json.dump(
                      {
                          "model": model,
                          "prompt": prompt,
                          "response": str(e)
                      },
                      f,
                      indent=2
                  )

              print(e)

          EOF

      - name: Commit Response
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add response.json
          git commit -m "Nexo AI Response" || true
          git push