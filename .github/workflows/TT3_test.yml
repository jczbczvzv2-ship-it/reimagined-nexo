name: Nexo MultiModel Test

on:
  workflow_dispatch:

jobs:
  ai:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Ask Multiple Models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEYS }}
        run: |
          python3 << 'EOF'
          import requests
          import json
          import os

          api_key = os.environ["OPENROUTER_API_KEY"]

          models = {
              "DeepSeek": "deepseek/deepseek-chat",
              "Gemini": "google/gemini-2.5-flash",
              "GPT": "openai/gpt-4o-mini"
          }

          results = {}

          for name, model in models.items():
              response = requests.post(
                  "https://openrouter.ai/api/v1/chat/completions",
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json"
                  },
                  json={
                      "model": model,
                      "messages": [
                          {
                              "role": "system",
                              "content": "You are Nexo AI."
                          },
                          {
                              "role": "user",
                              "content": "Who are you?"
                          }
                      ]
                  }
              )

              data = response.json()

              try:
                  results[name] = data["choices"][0]["message"]["content"]
              except:
                  results[name] = str(data)

          with open("response.json", "w") as f:
              json.dump(results, f, indent=2)

          print(json.dumps(results, indent=2))
          EOF

      - name: Commit Response
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add response.json
          git commit -m "Multi model test" || true
          git push