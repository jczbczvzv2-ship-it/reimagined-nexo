name: Nexo Multi AI Test

on:
  workflow_dispatch:

jobs:
  ai:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Ask All Models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEM }}
        run: |
          python3 << 'EOF'
          import requests
          import json
          import os

          results = {}

          # DeepSeek
          try:
              r = requests.post(
                  "https://openrouter.ai/api/v1/chat/completions",
                  headers={
                      "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                      "Content-Type": "application/json"
                  },
                  json={
                      "model":"deepseek/deepseek-chat",
                      "messages":[
                          {"role":"system","content":"You are Nexo AI."},
                          {"role":"user","content":"Who are you?"}
                      ]
                  }
              )
              data = r.json()
              results["DeepSeek"] = data["choices"][0]["message"]["content"]
          except Exception as e:
              results["DeepSeek"] = str(e)

          # GPT
          try:
              r = requests.post(
                  "https://openrouter.ai/api/v1/chat/completions",
                  headers={
                      "Authorization": f"Bearer {os.environ['OPENROUTER_API_KEY']}",
                      "Content-Type": "application/json"
                  },
                  json={
                      "model":"openai/gpt-4o-mini",
                      "messages":[
                          {"role":"system","content":"You are Nexo AI."},
                          {"role":"user","content":"Who are you?"}
                      ]
                  }
              )
              data = r.json()
              results["GPT"] = data["choices"][0]["message"]["content"]
          except Exception as e:
              results["GPT"] = str(e)

          # Gemini
          try:
              r = requests.post(
                  f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={os.environ['GEMINI_API_KEY']}",
                  headers={
                      "Content-Type": "application/json"
                  },
                  json={
                      "contents":[
                          {
                              "parts":[
                                  {
                                      "text":"Who are you?"
                                  }
                              ]
                          }
                      ]
                  }
              )

              data = r.json()

              results["Gemini"] = data["candidates"][0]["content"]["parts"][0]["text"]

          except Exception as e:
              results["Gemini"] = str(e)

          with open("response.json","w") as f:
              json.dump(results,f,indent=2)

          print(json.dumps(results,indent=2))
          EOF

      - name: Commit Response
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add response.json
          git commit -m "Update multi-model responses" || true
          git push